name: CI

# ENH-011: before this workflow existed, `.github/workflows/` was empty --
# nothing prevented a broken or vulnerable change from merging. Every gain from
# ENH-001 through ENH-033 (SQL-injection guards, fail-closed auth, delivery
# confirmation, buffer bounds) is enforced by tests that nothing was running.
#
# Jobs are deliberately independent so one slow/flaky area cannot mask another.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref -- CI minutes are a real cost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Check OpenAPI spec is up to date
        # docs/api/openapi.{json,yaml} are the published API reference. If this fails,
        # run `python scripts/export_openapi.py` and commit the result.
        run: python scripts/export_openapi.py --check

      - name: Run tests
        # tests/routes_tests needs the full stack; the route-tests job runs it.
        run: |
          pytest tests/ \
            --ignore=tests/routes_tests \
            -v \
            --junitxml=junit-api.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: junit-api.xml

  route-tests:
    name: API route tests (live stack)
    # The ~220 route tests in tests/routes_tests drive the real API over HTTP
    # against ClickHouse, Redpanda, Redis and MinIO started from the same
    # compose file as ./deploy.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: infra/docker/compose.yml
      LOGFORGE_API_URL: http://localhost:7080
      # Fail, not skip, if the API never came up.
      LOGFORGE_REQUIRE_API: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt pyyaml

      - name: Start infrastructure
        run: docker compose up -d --build --wait clickhouse minio redis redpanda

      - name: Create Kafka topics
        run: python infra/setup_kafka_topics.py --environment development --force-recreate

      - name: Start API
        run: |
          docker compose up -d --build api
          for i in $(seq 1 90); do
            if curl -fsS "$LOGFORGE_API_URL/health" > /dev/null; then
              echo "API is up after ${i}x2s"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"; docker compose logs api | tail -200; exit 1

      - name: Run route tests
        working-directory: tests/routes_tests
        run: pytest . -v --junitxml=../../junit-routes.xml

      - name: Query language and pack tests against ClickHouse
        # LogforgeQL pipeline answers checked against Python on a seeded dataset.
        env:
          LOGFORGE_TEST_CLICKHOUSE: localhost:8124
          LOGFORGE_REQUIRE_CLICKHOUSE: "1"
        run: pytest tests/test_logql_pipeline_live.py tests/test_analyst_questions_live.py tests/test_pack_ci_live.py tests/test_nl2query_eval_live.py tests/test_copilot_eval_live.py tests/test_entities_live.py tests/test_log_patterns_live.py tests/test_storage_tiers_live.py -v

      - name: API logs on failure
        if: failure()
        run: docker compose logs --no-color api clickhouse-migrations | tail -400

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-test-results
          path: junit-routes.xml

      - name: Stop stack
        if: always()
        run: docker compose down -v

  ui-e2e:
    name: UI end-to-end (Playwright, live stack)
    # Builds and starts the full compose stack (production UI image), seeds
    # the demo tenant and user with scripts/bootstrap_demo.py, then runs the
    # whole Playwright suite (apps/ui/tests).
    # Pinned: Playwright 1.55 (apps/ui) has no browser builds for the
    # ubuntu-latest image (26.04). Move with a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_FILE: infra/docker/compose.yml
      PLAYWRIGHT_BASE_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:7080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Start infrastructure
        run: |
          pip install pyyaml
          docker compose up -d --build --wait clickhouse minio redis redpanda
          python infra/setup_kafka_topics.py --environment development --force-recreate

      - name: Start API and UI
        run: |
          docker compose up -d --build api ui
          for url in http://localhost:7080/health http://localhost:3001/login; do
            for i in $(seq 1 90); do
              curl -fsS "$url" > /dev/null && break
              [ "$i" = 90 ] && { echo "$url never came up"; docker compose logs api ui | tail -200; exit 1; }
              sleep 2
            done
          done

      - name: Create demo tenant and user
        run: python scripts/bootstrap_demo.py

      - name: Install Playwright
        working-directory: apps/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: apps/ui
        run: npx playwright test --project=chromium --trace off

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color api ui | tail -400

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/ui/playwright-report
            apps/ui/test-results
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose down -v

  api-lint:
    name: API lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install ruff

      - name: Ruff
        # Advisory for now: the existing codebase has a large backlog of style
        # findings and failing the build on them would block every PR. Errors
        # that indicate real bugs (F821 undefined name, F811 redefinition) are
        # enforced below.
        continue-on-error: true
        run: ruff check apps/api --output-format=github

      - name: Ruff (blocking correctness rules)
        # F821 (undefined name) and F811 (redefinition) catch real crashes, not
        # style. Adding this gate immediately surfaced three live bugs:
        #   - storage_dao.py used `timedelta` without importing it (NameError)
        #   - parsers.py referenced `kwargs` it never accepted (NameError on
        #     every JSON-format nginx log)
        #   - ai_api.py registered two handlers on the same route, the first of
        #     which imported a non-existent module (500 on every call)
        # All three are fixed; this gate keeps them fixed.
        #
        # F402 (import shadowed by loop variable) is NOT blocking: the four
        # occurrences in high_performance_normalizer.py are latent hazards
        # rather than current bugs, and that file is a hot path not worth
        # churning here. It is reported by the advisory step above.
        run: |
          ruff check apps/api \
            --select F821,F811 \
            --output-format=github

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # gitleaks-action lists the PR's commits via the API; with only
    # `contents: read` that call is refused (403) and the job fails.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install scanners
        run: pip install pip-audit bandit

      - name: Dependency vulnerabilities
        # Blocking: the dependency set audits clean, so a new advisory fails CI
        # and gets an upgrade PR instead of accumulating silently.
        run: pip-audit -r apps/api/requirements.txt

      - name: Static security analysis
        # -ll: report medium and high severity only, to keep signal high.
        continue-on-error: true
        run: bandit -r apps/api -ll -f screen

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ui-build:
    name: UI build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [ui, admin-ui]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Type check
        # Blocking: both apps type-check cleanly, so a new error is a regression.
        working-directory: apps/${{ matrix.app }}
        run: npx tsc --noEmit

      - name: Unit tests
        if: matrix.app == 'ui'
        working-directory: apps/${{ matrix.app }}
        run: npm run test:unit

      - name: Build
        working-directory: apps/${{ matrix.app }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
