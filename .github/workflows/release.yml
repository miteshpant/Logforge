# Release (Phase 14, docs/security.md): on a v* tag, build the API, UI and
# admin UI images, push them to GHCR, sign them with cosign (keyless, the
# workflow's OIDC identity), and attach SPDX SBOMs to the GitHub release.
#
# Verify an image:
#   cosign verify ghcr.io/<owner>/logforge-api:<tag> \
#     --certificate-identity-regexp 'https://github.com/<owner>/.+/.github/workflows/release.yml@refs/tags/v.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # the GitHub release and its SBOMs
  packages: write   # GHCR
  id-token: write   # keyless signing

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        app: [api, ui, admin-ui]
    steps:
      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/logforge-${{ matrix.app }}:${{ github.ref_name }}

      - name: Sign
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/logforge-${{ matrix.app }}@${{ steps.build.outputs.digest }}"

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/logforge-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: logforge-${{ matrix.app }}-${{ github.ref_name }}.spdx.json
          upload-release-assets: true
