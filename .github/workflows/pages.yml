name: Publish docs

# Publishes the docs site (docs/ via MkDocs, with the Redoc API reference at
# /api/) to GitHub Pages
# whenever it changes on main. One-time setup: Settings -> Pages -> Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs site
        # docs/ rendered with MkDocs; docs/api (Redoc + OpenAPI) is copied in
        # as static files and served at /api/.
        run: |
          pip install mkdocs-material==9.5.39
          mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
