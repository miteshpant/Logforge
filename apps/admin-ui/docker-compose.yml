version: '3.8'

services:
  # Admin UI - Separate service for platform administration
  admin-ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: logforge-admin-ui
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:7080
      - NEXT_PUBLIC_ADMIN_MODE=true
    restart: unless-stopped
    networks:
      - logforge-network

networks:
  logforge-network:
    external: true