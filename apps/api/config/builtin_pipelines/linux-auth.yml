# Built-in pipeline: Linux sshd authentication -> OCSF Authentication (3002).
# Accepted / Failed password|publickey|keyboard-interactive for USER from IP,
# and "Invalid user USER from IP". Other sshd lines pass through unchanged.
# Sets the legacy fields too (event_type, result, user, src_ip), so the
# existing brute-force rules keep working on this source.
name: linux-auth
description: Linux sshd authentication, mapped to OCSF Authentication
processors:
  - syslog: {field: msg}
    if: "matches(msg, '^(<[0-9]+>)?[A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2} ')"
    ignore_failure: true
  - regex:
      field: msg
      target: attrs._auth
      patterns:
        - '^(?P<result>Failed|Accepted) (?P<method>\S+) for (?:invalid user )?(?P<user>\S+) from (?P<ip>\S+) port (?P<port>\d+)'
        - '^(?P<result>Invalid) user (?P<user>\S+) from (?P<ip>\S+)(?: port (?P<port>\d+))?'
    ignore_failure: true  # not an authentication line
  - script:
      source: |
        attrs.ocsf.class_uid = 3002
        attrs.ocsf.class_name = 'Authentication'
        attrs.ocsf.category_uid = 3
        attrs.ocsf.activity_id = 1
        attrs.ocsf.activity_name = 'Logon'
        attrs.ocsf.status_id = 1 if attrs._auth.result == 'Accepted' else 2
        attrs.ocsf.status = 'Success' if attrs._auth.result == 'Accepted' else 'Failure'
        attrs.ocsf.status_detail = 'invalid user' if attrs._auth.result == 'Invalid' or contains(msg, 'invalid user') else ('wrong ' + attrs._auth.method if attrs._auth.result == 'Failed' else None)
        attrs.ocsf.auth_protocol = attrs._auth.method
        attrs.ocsf.actor.user.name = attrs._auth.user
        attrs.ocsf.src_endpoint.ip = attrs._auth.ip
        attrs.ocsf.src_endpoint.port = int(attrs._auth.port)
        attrs.event_type = 'authentication'
        attrs.result = 'success' if attrs._auth.result == 'Accepted' else 'failed'
        attrs.user = attrs._auth.user
        src_ip = attrs._auth.ip
        user_id = attrs._auth.user
        del attrs._auth
    if: "exists('attrs._auth')"
  - compact: {field: attrs.ocsf, values: [""]}
