    - cpu_percent
    - cpu_utilization
    - system.cpu
    - system_cpu
    - system.cpu.utilization
    - container_cpu
    - process_cpu
    - cpu_load
    - processor_usage

memory_usage:
  description: "Memory utilization percentage"
  unit: "%"
  category: "infrastructure"
  variations:
    - memory_usage
    - memory
    - mem_usage
    - mem_percent
    - memory_utilization
    - system.memory
    - system_memory
    - system.memory.utilization
    - container_memory
    - process_memory
    - ram_usage
    - heap_usage

disk_usage:
  description: "Disk utilization percentage"
  unit: "%"
  category: "infrastructure"
  variations:
    - disk_usage
