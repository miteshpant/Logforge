    - inbound_bytes
    - ingress_bytes

network_out:
  description: "Network bytes transmitted"
  unit: "bytes"
  category: "infrastructure"
  variations:
    - network_out
    - network_transmit
    - bytes_sent
    - tx_bytes
    - network.out
    - outbound_bytes
