# ============================================================================
# QUEUE METRICS
# ============================================================================

queue_depth:
  description: "Queue message depth/backlog"
  unit: "count"
  category: "queue"
  variations:
    - queue_depth
    - queue_size
    - queue_length
    - messages_pending
    - backlog
