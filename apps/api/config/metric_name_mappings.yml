# Metric Name Mappings Configuration
# Maps common metric name variations to standardized Logforge metric names
#
# Format:
#   standard_name:
#     description: What this metric represents
#     unit: Expected unit (ms, %, count, req/s, etc.)
#     category: Category for grouping (apm, infrastructure, custom)
#     variations: List of accepted input names that map to this standard name
#
# Custom metrics: Any metric name starting with "custom." passes through unchanged

# ============================================================================
# APM METRICS - Application Performance Monitoring
# ============================================================================

response_time:
  description: "HTTP response time / request latency"
  unit: "ms"
  category: "apm"
  variations:
    - response_time
    - latency
    - request_latency
    - http_latency
    - avg_latency
    - average_latency
    - request_duration
    - http_request_duration
    - http.request.duration
    - http_response_time
    - response_latency
    - api_latency
    - endpoint_latency
    - service_latency
    - round_trip_time
    - rtt

throughput:
  description: "Request throughput / requests per second"
  unit: "req/s"
  category: "apm"
  variations:
    - throughput
    - requests
    - request_rate
    - requests_per_second
    - rps
    - qps
    - queries_per_second
    - http_requests
    - http_request_count
    - http.request.count
    - request_count
    - transaction_rate
    - tps
    - transactions_per_second

error_rate:
  description: "Error rate percentage"
  unit: "%"
  category: "apm"
  variations:
    - error_rate
    - errors
    - error_count
    - error_percentage
    - failure_rate
    - failures
    - http_errors
    - http_error_rate
    - http.error.rate
    - request_errors
    - 5xx_rate
    - 4xx_rate
    - exception_rate

