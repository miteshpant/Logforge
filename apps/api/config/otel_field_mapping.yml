# ============================================================================
# NESTED FIELD EXTRACTION
# ============================================================================

# Extract fields from nested objects
nested_extractions:
  # Extract service info from resource
  service_name_from_resource:
    - resource.service.name
    - resource.serviceName
    - resource.app.name
    - resource.application.name

  service_version_from_resource:
    - resource.service.version
    - resource.serviceVersion
    - resource.app.version
    - resource.version

  # Extract service instance ID from resource
  service_instance_id_from_resource:
    - resource.service_instance_id
    - resource.serviceInstanceId
    - resource.service.instance.id
    - resource.k8s.pod.name
    - resource.pod.name
    - resource.container.id
    - resource.host.id

  # Extract HTTP info from attributes
  http_method_from_attributes:
    - attributes.http.method
    - attributes.method
    - attributes.verb

  # Extract Kubernetes info from resource
  k8s_pod_from_resource:
    - resource.k8s.pod.name
    - resource.kubernetes.pod.name
    - resource.pod.name

  k8s_namespace_from_resource:
    - resource.k8s.namespace.name
    - resource.kubernetes.namespace
    - resource.namespace

