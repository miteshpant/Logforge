    event: {service: sudo, hostname: app-02, user: www-data, process_name: /usr/bin/sudo, event_type: sudo, result: failed, message: 'www-data : 3 incorrect password attempts ; TTY=pts/1 ; USER=root ; COMMAND=/bin/bash'}
