; Pytest configuration for the Logforge repository.
;
; Why this file exists (ENH-001):
; The API is written with FLAT imports -- apps/api/main.py does
; `from app_config import load_config`, not `from apps.api.app_config import ...`.
; The test suite, however, imports the app via its PACKAGE path
; (`from apps.api.main import app` in tests/routes_tests/conftest.py).
;
; Both styles are therefore required on sys.path simultaneously:
;   .          -> makes `apps.api.*` importable as a package
;   apps/api   -> makes `app_config`, `models`, `parsers`, ... importable flat
;
; Without this, collection aborts with:
;   ModuleNotFoundError: No module named 'app_config'
;
; Do not remove either entry without first converting the API to a single
; import style (tracked as ENH-010).

[pytest]
; `pythonpath` entries resolve relative to this file's directory (the rootdir),
; so running pytest from anywhere in the repo picks up the same paths.
; `tests/routes_tests` is a package (it has an __init__.py), so its modules do
; NOT resolve as siblings. Several suites nevertheless do `from base_test import
; BaseTestSuite`. Listing the directory here keeps those flat imports working.
pythonpath =
    .
    apps/api
    tests/routes_tests
    tests/eval/detection

testpaths =
    tests


norecursedirs =
    .git
    venv
    node_modules
    .next
    __pycache__
    apps/ui
    apps/admin-ui

python_files = test_*.py
python_classes = Test*
python_functions = test_*

; pytest-asyncio 0.21.x: `strict` requires explicit @pytest.mark.asyncio markers,
; which is what the existing tests use.
asyncio_mode = strict

addopts =
    --strict-markers
    -ra


markers =
    integration: requires live infrastructure (ClickHouse, Kafka, Redis)
    slow: long-running test
