# FedRAMP Deployment Configuration
# For US Government agencies requiring FedRAMP compliance

storage:
  deployment:
    type: "fedramp"
    region: "us-gov-east-1"  # AWS GovCloud
    compliance_tier: "fedramp"
    
  hot:
    retention_days: 30  # Extended retention for government
    compression: "zstd"
    partition_strategy: "monthly"
    replica_count: 3  # High availability for critical government data
    
  cold:
    enabled: true
    backend: "s3"
    retention_days: 2555  # 7 years minimum for federal records
    
    backends:
      s3:
        fedramp:
          enabled: true
          bucket: "gov-agency-logforge-fedramp"
          region: "us-gov-east-1"
          endpoint: "https://s3.us-gov-east-1.amazonaws.com"
          # Government-provided credentials for GovCloud
          access_key: "${FEDRAMP_S3_ACCESS_KEY}"
          secret_key: "${FEDRAMP_S3_SECRET_KEY}"
          
  backup:
    enabled: true
    backend: "s3"
    schedule: "0 1 * * *"  # Daily backups
    cross_region_replication: true  # Backup to us-gov-west-1
    retention_days: 2555  # 7 years
    
  lifecycle:
    hot_to_cold_days: 30
    cold_to_archive_days: 365
    delete_after_days: 2555  # FedRAMP compliance
    
  encryption:
    at_rest:
      enabled: true
      algorithm: "AES-256"
      key_management: "hsm"  # Hardware Security Module required
      
    in_transit:
      enabled: true
      tls_version: "1.3"  # Latest TLS required
      
    customer_keys:
      enabled: true
      hsm_partition: "${FEDRAMP_HSM_PARTITION}"
      
  tenancy:
    model: "isolated"
    namespace_strategy: "separate_account"  # Complete AWS account isolation
    isolation:
      compute: "isolated"     # Dedicated FedRAMP-authorized infrastructure
      storage: "isolated"     # GovCloud-only storage
      network: "isolated"     # Air-gapped network architecture
      
  # Additional FedRAMP requirements
  audit:
    enabled: true
    log_all_access: true
    retention_days: 2555
    
  monitoring:
    enabled: true
    security_alerts: true
    performance_monitoring: true
    
  access_control:
    mfa_required: true
    privileged_access_management: true
    session_recording: true