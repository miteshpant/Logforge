title: Failed sudo authentication
id: lf-b-sudo-failed
name: sudo_failed
generate: false
status: stable
description: sudo refused a user (wrong password or not in sudoers), building block.
author: Logforge Security Team
date: 2026/11/17
tags: [attack.privilege_escalation, attack.t1548.003]
logsource: {product: linux, service: sudo}
detection:
    selection:
        event_type: sudo
        result: [failed, failure, denied]
    condition: selection
fixtures:
    true_positive: {event_type: sudo, result: failed, user: www-data, hostname: app-02}
    true_negative: {event_type: sudo, result: success, user: ops_admin, hostname: app-02}
level: low
---
title: Repeated sudo failures by one user
id: lf-c-sudo-failure-burst
status: stable
description: Three or more refused sudo attempts by one user on one host within 10 minutes; typical of a compromised low-privilege account trying to escalate.
author: Logforge Security Team
date: 2026/11/17
references: [https://attack.mitre.org/techniques/T1548/003/]
tags: [attack.privilege_escalation, attack.t1548.003]
falsepositives:
    - An administrator who forgot their password
correlation:
    type: event_count
    rules: [sudo_failed]
    group-by: [hostname, user]
    timespan: 10m
    condition: {gte: 3}
fixtures:
    true_positive_batch:
        - {repeat: 3, every: 20s, event: {event_type: sudo, result: failed, user: www-data, hostname: app-02}}
    true_negative_batch:
        - {repeat: 2, every: 20s, event: {event_type: sudo, result: failed, user: www-data, hostname: app-02}}
        - {event_type: sudo, result: failed, user: www-data, hostname: app-01}
        - {repeat: 10, event: {event_type: sudo, result: success, user: ops_admin, hostname: app-02}}
level: high
