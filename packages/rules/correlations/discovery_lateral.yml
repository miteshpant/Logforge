title: One account logging on to many hosts
id: lf-c-lateral-logon-fanout
status: stable
description: One account makes network logons to five or more different hosts within 10 minutes, a common sign of lateral movement with stolen credentials.
author: Logforge Security Team
date: 2026/11/17
references: [https://attack.mitre.org/techniques/T1021/]
tags: [attack.lateral_movement, attack.t1021]
falsepositives:
    - Deployment, inventory or backup service accounts (add them to an exclusion)
correlation:
    type: value_count
    rules: [network_logon]
    group-by: [user]
    timespan: 10m
    condition: {field: hostname, gte: 5}
fixtures:
    true_positive_batch:
        - {event_id: 4624, logon_type: 3, hostname: WS-042, user: carol}
        - {event_id: 4624, logon_type: 3, hostname: WS-043, user: carol}
        - {event_id: 4624, logon_type: 3, hostname: WS-044, user: carol}
        - {event_id: 4624, logon_type: 3, hostname: WS-051, user: carol}
        - {event_id: 4624, logon_type: 3, hostname: FS-01, user: carol}
    true_negative_batch:
        - {repeat: 20, event: {event_id: 4624, logon_type: 3, hostname: FS-01, user: carol}}
        - {event_id: 4624, logon_type: 2, hostname: WS-042, user: carol}
        - {event_id: 4624, logon_type: 2, hostname: WS-043, user: carol}
        - {event_id: 4624, logon_type: 2, hostname: WS-044, user: carol}
        - {event_id: 4624, logon_type: 2, hostname: WS-051, user: carol}
level: high
