title: File renamed with a ransomware extension
id: lf-b-file-encrypted
name: file_encrypted
generate: false
status: stable
description: A file was written with an extension used by ransomware (building block).
author: Logforge Security Team
date: 2026/11/17
tags: [attack.impact, attack.t1486]
logsource: {category: file_event}
detection:
    selection:
        target_filename|endswith: ['.locked', '.encrypted', '.crypt', '.crypted', '.enc', '.lockbit', '.ryk']
    condition: selection
fixtures:
    true_positive: {target_filename: 'C:\Shares\Finance\q3.xlsx.locked', hostname: FS-01}
    true_negative: {target_filename: 'C:\Shares\Finance\q3.xlsx', hostname: FS-01}
level: low
---
title: Mass file encryption on one host
id: lf-c-mass-file-encryption
status: stable
description: Twenty or more files rewritten with a ransomware extension on one host within 5 minutes.
author: Logforge Security Team
date: 2026/11/17
references: [https://attack.mitre.org/techniques/T1486/]
tags: [attack.impact, attack.t1486]
correlation:
    type: event_count
    rules: [file_encrypted]
    group-by: [hostname]
    timespan: 5m
    condition: {gte: 20}
fixtures:
    true_positive_batch:
        - {repeat: 20, event: {target_filename: 'C:\Shares\Finance\doc.xlsx.locked', hostname: FS-01}}
    true_negative_batch:
        - {repeat: 19, event: {target_filename: 'C:\Shares\Finance\doc.xlsx.locked', hostname: FS-01}}
        - {repeat: 20, event: {target_filename: 'C:\Shares\Finance\doc.xlsx', hostname: FS-01}}
level: critical
