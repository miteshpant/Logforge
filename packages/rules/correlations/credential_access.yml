# Credential-access correlations (Sigma correlation format, Phase 1).
#
# Base rules marked `generate: false` are building blocks: they match single
# events and feed the correlations below without alerting on their own.
# Every rule here is verified by the loader's fixture gate (timelines are
# replayed through the runtime) before it is enabled.

title: Failed authentication
id: lf-b-auth-failed
name: auth_failed
generate: false
status: stable
description: One failed authentication (building block).
author: Logforge Security Team
date: 2026/11/17
tags: [attack.credential_access, attack.t1110]
logsource: {category: authentication}
detection:
    selection:
        event_type: authentication
        result: [failed, failure, invalid, denied, rejected]
    condition: selection
fixtures:
    true_positive: {event_type: authentication, result: failed, user: root, src_ip: 203.0.113.9}
    true_negative: {event_type: authentication, result: success, user: root, src_ip: 203.0.113.9}
level: low
---
