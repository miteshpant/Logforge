title: MFA fatigue (push bombing)
id: lf-c-mfa-fatigue
status: stable
description: Five or more denied MFA prompts for one user within 10 minutes; an attacker holding the password keeps pushing until the user approves.
author: Logforge Security Team
date: 2026/11/17
references: [https://attack.mitre.org/techniques/T1621/]
tags: [attack.credential_access, attack.t1621]
falsepositives:
    - A misconfigured client retrying sign-in in a loop
correlation:
    type: event_count
    rules: [mfa_denied]
    group-by: [user]
    timespan: 10m
    condition: {gte: 5}
fixtures:
    true_positive_batch:
        - {repeat: 5, every: 30s, event: {event_type: mfa, result: denied, user: alice}}
    true_negative_batch:
        - {repeat: 4, every: 30s, event: {event_type: mfa, result: denied, user: alice}}
        - {repeat: 4, every: 30s, event: {event_type: mfa, result: denied, user: bob}}
level: high
