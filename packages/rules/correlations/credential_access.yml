title: Burst of failed logins from one source
id: lf-c-brute-burst
name: brute_burst
generate: false
status: stable
description: Five or more failed logins from one source within 5 minutes (building block for the chain below; bf001 alerts on 10).
author: Logforge Security Team
date: 2026/11/17
tags: [attack.credential_access, attack.t1110]
correlation:
    type: event_count
    rules: [auth_failed]
    group-by: [src_ip]
    timespan: 5m
    condition: {gte: 5}
fixtures:
    true_positive_batch:
        - {repeat: 5, every: 10s, event: {event_type: authentication, result: failed, user: root, src_ip: 203.0.113.9}}
    true_negative_batch:
        - {repeat: 4, every: 10s, event: {event_type: authentication, result: failed, user: root, src_ip: 203.0.113.9}}
        - {at: 10m, event: {event_type: authentication, result: failed, user: root, src_ip: 203.0.113.9}}
level: low
---
title: Brute force followed by a successful login
id: lf-c-brute-force-then-success
status: stable
description: >
  A burst of failed logins from one source, then a successful login from the
  same source within 15 minutes: the guessing probably worked.
author: Logforge Security Team
date: 2026/11/17
references: [https://attack.mitre.org/techniques/T1110/, https://attack.mitre.org/techniques/T1078/]
tags: [attack.credential_access, attack.initial_access, attack.t1110, attack.t1078]
falsepositives:
    - A user who forgot a password and then remembered it, from a shared NAT address
correlation:
    type: temporal_ordered
    rules: [brute_burst, auth_success]
    group-by: [src_ip]
    timespan: 15m
fixtures:
    true_positive_batch:
        - {repeat: 6, every: 5s, event: {event_type: authentication, result: failed, user: root, src_ip: 203.0.113.9}}
        - {at: 3m, event: {event_type: authentication, result: success, user: root, src_ip: 203.0.113.9}}
    true_negative_batch:
        # One typo then a success is normal; so is a success from another address.
        - {event_type: authentication, result: failed, user: alice, src_ip: 10.0.1.12}
        - {event_type: authentication, result: success, user: alice, src_ip: 10.0.1.12}
        - {repeat: 6, every: 5s, event: {event_type: authentication, result: failed, user: root, src_ip: 203.0.113.9}}
        - {at: 3m, event: {event_type: authentication, result: success, user: root, src_ip: 10.0.1.13}}
level: critical
---
title: Password spraying from one source
id: lf-c-password-spray
status: stable
description: Failed logins for five or more different accounts from one source within 10 minutes.
author: Logforge Security Team
date: 2026/11/17
references: [https://attack.mitre.org/techniques/T1110/003/]
tags: [attack.credential_access, attack.t1110.003]
falsepositives:
    - Several users behind one NAT address mistyping passwords at the same time
correlation:
    type: value_count
    rules: [auth_failed]
    group-by: [src_ip]
    timespan: 10m
    condition: {field: user, gte: 5}
fixtures:
    true_positive_batch:
        - {event_type: authentication, result: failed, user: alice, src_ip: 45.155.205.10}
        - {event_type: authentication, result: failed, user: bob, src_ip: 45.155.205.10}
        - {event_type: authentication, result: failed, user: carol, src_ip: 45.155.205.10}
        - {event_type: authentication, result: failed, user: dave, src_ip: 45.155.205.10}
        - {event_type: authentication, result: failed, user: erin, src_ip: 45.155.205.10}
    true_negative_batch:
        - {repeat: 20, event: {event_type: authentication, result: failed, user: root, src_ip: 45.155.205.10}}
        - {event_type: authentication, result: failed, user: alice, src_ip: 10.0.1.12}
        - {event_type: authentication, result: failed, user: bob, src_ip: 10.0.1.13}
level: high
