title: Several accounts locked out on one domain controller
id: lf-c-account-lockout-burst
status: stable
description: Three or more different accounts locked out on one domain controller within 15 minutes, typical of password guessing across accounts.
author: Logforge Security Team
date: 2026/11/17
references: [https://attack.mitre.org/techniques/T1110/]
tags: [attack.credential_access, attack.t1110]
falsepositives:
    - A password policy change or an expired service-account password used by several services
correlation:
    type: value_count
    rules: [account_lockout]
    group-by: [hostname]
    timespan: 15m
    condition: {field: target_user, gte: 3}
fixtures:
    true_positive_batch:
        - {event_id: 4740, hostname: DC-01, target_user: alice}
        - {event_id: 4740, hostname: DC-01, target_user: bob}
        - {event_id: 4740, hostname: DC-01, target_user: carol}
    true_negative_batch:
        - {repeat: 5, every: 1m, event: {event_id: 4740, hostname: DC-01, target_user: alice}}
        - {at: 1h, event: {event_id: 4740, hostname: DC-01, target_user: bob}}
        - {at: 2h, event: {event_id: 4740, hostname: DC-01, target_user: carol}}
level: high
