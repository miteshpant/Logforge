title: LSASS Memory Access for Credential Dumping
id: cd001-lsass-memory-dump
status: stable
description: >
  Detects tools and techniques used to dump credentials from LSASS process
  memory. This is the single highest-value post-exploitation action on Windows:
  it yields plaintext passwords, NTLM hashes and Kerberos tickets that enable
  immediate lateral movement.
author: Logforge Security Team
date: 2026/08/13
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://www.microsoft.com/security/blog/2022/10/17/defenders-guide-to-credential-theft/
tags:
    - attack.credential_access
    - attack.t1003.001
    - lsass
    - credential_dumping
logsource:
    category: process_creation
    product: windows
detection:
    selection_procdump:
        process_name|contains:
            - "procdump"
            - "procdump64"
        command_line|contains: "lsass"
    selection_comsvcs:
        command_line|contains: "comsvcs.dll"
    selection_known_tools:
        process_name|contains:
            - "mimikatz"
            - "pwdump"
            - "gsecdump"
    condition: 1 of selection_*
fields:
    - process_name
    - command_line
    - user
    - host
falsepositives:
    - Sysinternals ProcDump used by administrators for legitimate crash analysis
    - EDR and backup agents that legitimately read process memory
    - Security team red-team exercises (correlate with change calendar)
level: critical
