title: Multiple Failed Login Attempts Detection
id: bf001-brute-force-login
status: stable
description: Detects potential brute force attacks based on multiple failed authentication attempts from the same source IP
author: Logforge Security Team
date: 2024/01/01
references:
    - https://attack.mitre.org/techniques/T1110/
    - https://owasp.org/www-community/controls/Blocking_Brute_Force_Attacks
tags:
    - attack.credential_access
    - attack.t1110
    - brute_force
    - authentication
    - failed_login
falsepositives:
    - Users with bad password habits
    - Automated systems with credential rotation issues
    - Password managers with sync issues
level: high
logsource:
    category: authentication
    product: web_application
    service: login
detection:
    selection:
        event_type: 'authentication'
        result: 
            - 'failed'
            - 'invalid'
            - 'denied'
            - 'rejected'
    timeframe: 5m
    condition: count(selection) >= 10 by src_ip
fields:
    - src_ip
    - user_id
    - timestamp
    - user_agent
    - authentication_method
# Batch fixtures, verified by the rule loader before the rule is enabled: the
# positive batch must reach the threshold for one source IP, the negative
# batch must not (failures spread across IPs, or successes from one IP).
fixtures:
    true_positive_batch:
        - repeat: 10
          event:
              event_type: authentication
              result: failed
              src_ip: 203.0.113.9
              user_id: admin
    true_negative_batch:
        - repeat: 9
          event:
              event_type: authentication
              result: failed
              src_ip: 203.0.113.9
              user_id: admin
        - repeat: 20
          event:
              event_type: authentication
              result: success
              src_ip: 198.51.100.4
              user_id: alice
        - event:
              event_type: authentication
              result: failed
              src_ip: 198.51.100.7
          repeat: 1
