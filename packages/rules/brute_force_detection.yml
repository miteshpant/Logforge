title: Multiple Failed Login Attempts Detection
id: bf001-brute-force-login
status: stable
description: Detects potential brute force attacks based on multiple failed authentication attempts from the same source IP
author: Logforge Security Team
date: 2024/01/01
references:
    - https://attack.mitre.org/techniques/T1110/
    - https://owasp.org/www-community/controls/Blocking_Brute_Force_Attacks
tags:
    - attack.credential_access
    - attack.t1110
    - brute_force
    - authentication
    - failed_login
falsepositives:
    - Users with bad password habits
    - Automated systems with credential rotation issues
    - Password managers with sync issues
level: high
logsource:
    category: authentication
    product: web_application
    service: login
detection:
    selection:
        event_type: 'authentication'
        result: 
            - 'failed'
            - 'invalid'
            - 'denied'
            - 'rejected'
    timeframe: 5m
    condition: count(selection) >= 10 by src_ip
fields:
    - src_ip
    - user_id
    - timestamp
    - user_agent
    - authentication_method