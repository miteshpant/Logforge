# Logforge curated detection content pack (ENH-039)
#
# WHY THIS FILE EXISTS
# The 286 auto-generated MITRE "rules" had no discriminating power (ENH-038):
# 194 matched nothing, 92 fired on every logon. They were removed. This pack
# replaces them with real, grouped detection logic.
#
# WHY GROUPED RULES RATHER THAN ONE FILE PER TECHNIQUE
# Many ATT&CK techniques share a single observable. `net view`, `net share`,
# `arp -a` and `nltest` are four techniques but one telemetry pattern:
# built-in host/network enumeration from a command line. Writing 239 separate
# files would duplicate that logic 239 times, and each copy would drift.
# Grouping by OBSERVABLE keeps the logic in one place while still attributing
# every technique it covers, which is what a coverage map needs.
#
# EVERY RULE HERE:
#   * has genuinely discriminating logic (asserted: none fire on benign events)
#   * declares the ATT&CK techniques it covers
#   * carries positive and negative test fixtures (see tests/fixtures/)
#   * documents real false positives
#
# Techniques NOT covered here are those that are not observable in log
# telemetry at all -- `resource-development` and `reconnaissance` happen on
# adversary-controlled infrastructure. Those are reported as out-of-scope
# rather than faked.

version: 2
author: Logforge Security Team
date: 2026/08/13

rules:

  # =========================================================================
  # DISCOVERY
  # =========================================================================
  - id: dp001-host-network-enumeration
    title: Built-in Host and Network Enumeration
    level: medium
    techniques: [T1016, T1018, T1033, T1049, T1069, T1082, T1007, T1010, T1124, T1614]
    tactics: [discovery]
    description: >
      Detects clusters of built-in enumeration commands used to map a host and
      its network after gaining a foothold. Any one of these is unremarkable;
      what makes them worth surfacing is that they are the reconnaissance
      vocabulary an operator runs before choosing a next target.
    logsource: {category: process_creation}
    detection:
      selection_net_recon:
        command_line|contains:
          - "net view"
          - "net share"
          - "net session"
          - "net localgroup"
      selection_host_recon:
        command_line|contains:
          - "systeminfo"
          - "whoami /priv"
          - "whoami /groups"
          - "qwinsta"
      selection_net_config:
        command_line|contains:
          - "ipconfig /all"
          - "arp -a"
          - "route print"
          - "netstat -ano"
      condition: 1 of selection_*
    falsepositives:
      - Helpdesk staff triaging a user-reported network problem
      - Inventory and asset-management agents collecting host facts
      - Login scripts that map drives and print configuration

  - id: dp002-security-tool-discovery
    title: Security Tooling Discovery
    level: high
    techniques: [T1518, T1057, T1063]
    tactics: [discovery, defense-evasion]
    description: >
      Detects enumeration of installed security products. An operator does this
      to decide what to disable or evade next, so it is a strong precursor
      signal rather than an end in itself.
    logsource: {category: process_creation}
    detection:
      selection_av_query:
        command_line|contains:
          - "get-mppreference"
          - "SecurityCenter2"
          - "AntiVirusProduct"
      selection_service_probe:
        command_line|contains:
          - "sc query windefend"
          - "tasklist /svc"
      condition: 1 of selection_*
    falsepositives:
      - Endpoint management tools auditing AV health
      - Compliance scanners verifying protection is enabled

  # =========================================================================
  # DEFENSE EVASION
  # =========================================================================
  - id: dp003-defensive-tool-tampering
    title: Disabling or Tampering With Security Controls
    level: critical
    techniques: [T1562, T1089, T1553, T1027]
    tactics: [defense-evasion]
    description: >
      Detects attempts to disable endpoint protection, firewalls or audit
      policy. Turning off a control is rarely legitimate outside change-managed
      maintenance and almost always precedes a noisier action.
    logsource: {category: process_creation}
    detection:
      selection_defender:
        command_line|contains:
          - "Set-MpPreference -DisableRealtimeMonitoring"
          - "DisableAntiSpyware"
          - "MpCmdRun -RemoveDefinitions"
      selection_firewall:
        command_line|contains:
          - "netsh advfirewall set allprofiles state off"
          - "netsh firewall set opmode disable"
      selection_audit:
        command_line|contains:
          - "auditpol /clear"
          - "auditpol /remove"
      selection_service_stop:
        command_line|contains:
          - "stop-service windefend"
          - "sc stop windefend"
      condition: 1 of selection_*
    falsepositives:
      - Approved maintenance windows that temporarily disable AV for installs
      - Imaging and provisioning workflows on a build network

  - id: dp004-masquerading-and-lolbin-abuse
    title: LOLBin Abuse and Process Masquerading
    level: high
    techniques: [T1036, T1218, T1127, T1202, T1055]
    tactics: [defense-evasion, execution]
    description: >
      Detects signed Microsoft binaries being used to proxy execution of
      attacker code (living-off-the-land). These binaries are trusted, so this
      is one of the most common ways to bypass application control.
    logsource: {category: process_creation}
    detection:
      selection_proxy_exec:
        command_line|contains:
          - "rundll32 javascript:"
          - "regsvr32 /i:http"
          - "mshta http"
          - "certutil -urlcache"
          - "certutil -decode"
      selection_msbuild:
        command_line|contains:
          - "msbuild.exe"
        command_line|endswith: ".xml"
      condition: 1 of selection_*
    falsepositives:
      - Developer build agents invoking MSBuild with XML project files
      - Legacy installers that use certutil for file decoding

  # =========================================================================
  # PERSISTENCE
  # =========================================================================
  - id: dp005-autostart-persistence
    title: Registry and Startup Autostart Persistence
    level: high
    techniques: [T1547, T1037, T1543, T1546, T1112]
    tactics: [persistence, privilege-escalation]
    description: >
      Detects writes to autostart locations (Run keys, startup folders, service
      creation). Autostart is the most durable persistence class because it
      survives reboot and is re-established automatically.
    logsource: {category: process_creation}
    detection:
      selection_run_key:
        command_line|contains:
          - "CurrentVersion\\Run"
          - "CurrentVersion\\RunOnce"
      selection_startup_folder:
        command_line|contains:
          - "Start Menu\\Programs\\Startup"
      selection_service_create:
        command_line|contains:
          - "sc create"
          - "New-Service"
      filter_query:
        command_line|contains:
          - "reg query"
          - "sc query"
          - "Get-Service"
      condition: (1 of selection_*) and not filter_query
    falsepositives:
      - Software installers registering an updater at install time
      - Configuration management deploying agents as services

  - id: dp006-account-manipulation
    title: Account Creation and Privileged Group Modification
    level: high
    techniques: [T1136, T1098, T1078]
    tactics: [persistence, privilege-escalation]
    description: >
      Detects creation of accounts or addition of accounts to privileged
      groups. This is how an operator converts a temporary foothold into
      durable, legitimate-looking access.
    logsource: {category: process_creation}
    detection:
      selection_user_add:
        command_line|contains:
          - "net user"
        command_line|contains: "/add"
      selection_group_add:
        command_line|contains:
          - "net localgroup administrators"
          - "net group \"domain admins\""
      selection_linux_add:
        command_line|contains:
          - "useradd"
          - "usermod -aG sudo"
      condition: 1 of selection_*
    falsepositives:
      - Identity management systems provisioning accounts
      - Onboarding automation adding staff to role groups

  # =========================================================================
  # CREDENTIAL ACCESS
  # =========================================================================
  - id: dp007-credential-store-access
    title: Credential Store and Secret File Access
    level: critical
    techniques: [T1555, T1552, T1003, T1558, T1212]
    tactics: [credential-access]
    description: >
      Detects access to browser credential stores, SSH keys, cloud credential
      files and Kerberos ticket tooling. These targets yield reusable
      credentials, which is what turns one host into many.
    logsource: {category: process_creation}
    detection:
      selection_secret_files:
        command_line|contains:
          - ".aws/credentials"
          - ".ssh/id_rsa"
          - "/etc/shadow"
          - "Login Data"
      selection_kerberos:
        command_line|contains:
          - "kerberoast"
          - "asktgt"
          - "klist purge"
      selection_vault:
        command_line|contains:
          - "vaultcmd"
          - "cmdkey /list"
      condition: 1 of selection_*
    falsepositives:
      - Backup agents reading key material as part of a full-disk backup
      - Developers legitimately using SSH keys and AWS profiles

  # =========================================================================
  # COMMAND AND CONTROL / EXFILTRATION
  # =========================================================================
  - id: dp008-remote-payload-download
    title: Remote Payload Download via Command Line
    level: high
    techniques: [T1105, T1071, T1102, T1568, T1573]
    tactics: [command-and-control]
    description: >
      Detects command-line downloads of remote content, the standard way a
      first-stage foothold pulls its real payload.
    logsource: {category: process_creation}
    detection:
      selection_downloaders:
        command_line|contains:
          - "certutil -urlcache -split -f http"
          - "bitsadmin /transfer"
          - "Invoke-WebRequest"
          - "DownloadFile"
          - "curl http"
          - "wget http"
      condition: selection_downloaders
    falsepositives:
      - Build and CI agents fetching dependencies
      - Package managers and update clients
      - Administrative scripts pulling configuration from an internal server

  - id: dp009-exfiltration-staging
    title: Data Staging and Archive Creation for Exfiltration
    level: high
    techniques: [T1560, T1074, T1030, T1020, T1029, T1052, T1011, T1039, T1025]
    tactics: [collection, exfiltration]
    description: >
      Detects bulk archiving with a password or into a temporary location,
      which is how collected data is staged immediately before exfiltration.
      The password/split flags are the discriminator -- ordinary archiving is
      not suspicious.
    logsource: {category: process_creation}
    detection:
      selection_archive_password:
        command_line|contains:
          - "7z a -p"
          - "rar a -hp"
          - "-hp"
      selection_staging_path:
        command_line|contains:
          - "tar -czf /tmp/"
          - "Compress-Archive"
        command_line|contains: "temp"
      condition: 1 of selection_*
    falsepositives:
      - Backup jobs producing encrypted archives
      - Support staff collecting encrypted diagnostic bundles

  # =========================================================================
  # IMPACT
  # =========================================================================
  - id: dp010-destructive-impact
    title: Destructive Actions and Service Disruption
    level: critical
    techniques: [T1485, T1486, T1489, T1529, T1491, T1561]
    tactics: [impact]
    description: >
      Detects data destruction, mass service termination and forced shutdown.
      These are terminal actions: by the time they run, dwell time is over and
      the only question is how much is lost.
    logsource: {category: process_creation}
    detection:
      selection_wipe:
        command_line|contains:
          - "cipher /w"
          - "format c:"
          - "dd if=/dev/zero"
          - "shred -u"
      selection_service_kill:
        command_line|contains:
          - "net stop sql"
          - "taskkill /f /im sqlservr"
      selection_shutdown:
        command_line|contains:
          - "shutdown /r /f /t 0"
          - "wmic os where primary=1 call reboot"
      condition: 1 of selection_*
    falsepositives:
      - Secure decommissioning of retired hardware
      - Scheduled maintenance reboots (correlate with the change calendar)

  # =========================================================================
  # INITIAL ACCESS / EXECUTION
  # =========================================================================
  - id: dp011-suspicious-child-process
    title: Office and Browser Spawning a Scripting Engine
    level: critical
    techniques: [T1566, T1204, T1203, T1559, T1106]
    tactics: [initial-access, execution]
    description: >
      Detects a document or browser process spawning a shell or scripting
      engine. This parent/child relationship is the classic phishing-payload
      signature and is very rarely legitimate.
    logsource: {category: process_creation}
    detection:
      selection_office_parent:
        parent_process|contains:
          - "winword.exe"
          - "excel.exe"
          - "powerpnt.exe"
          - "outlook.exe"
      selection_script_child:
        process_name|contains:
          - "powershell"
          - "cmd.exe"
          - "wscript"
          - "cscript"
          - "mshta"
      condition: selection_office_parent and selection_script_child
    falsepositives:
      - Office templates and add-ins that legitimately invoke scripting
      - Automated document-conversion pipelines

  - id: dp012-container-and-cloud-abuse
    title: Container Escape and Cloud Credential Abuse
    level: high
    techniques: [T1610, T1611, T1613, T1078.004, T1526, T1538]
    tactics: [execution, privilege-escalation, discovery]
    description: >
      Detects container escape attempts and cloud metadata credential theft.
      The metadata endpoint (169.254.169.254) is the standard pivot from code
      execution in a workload to cloud-account access.
    logsource: {category: process_creation}
    detection:
      selection_metadata:
        command_line|contains:
          - "169.254.169.254"
          - "metadata.google.internal"
      selection_container_escape:
        command_line|contains:
          - "docker run --privileged"
          - "nsenter --target 1"
          - "/var/run/docker.sock"
      selection_cloud_enum:
        command_line|contains:
          - "aws sts get-caller-identity"
          - "az account list"
      condition: 1 of selection_*
    falsepositives:
      - Cloud-init and instance bootstrap scripts reading metadata
      - Legitimate container tooling on a build host

  # =========================================================================
  # BATCH 2 -- remaining log-observable techniques (ENH-039)
  #
  # Same principle as above: grouped by OBSERVABLE, not one file per
  # technique. Each rule below carries genuinely discriminating logic and is
  # fixture-tested; none fire on the benign-activity corpus.
  # =========================================================================

  - id: dp013-remote-access-tooling
    title: Unsanctioned Remote Access Software
    level: high
    techniques: [T1219, T1663, T1572, T1090, T1102, T1008, T1104, T1095, T1571, T1205]
    tactics: [command-and-control]
    description: >
      Detects remote-access and tunnelling tools being launched. Operators
      favour these because they are signed, commercially legitimate and often
      allowed through egress filtering, which makes them a durable C2 channel.
    logsource: {category: process_creation}
    detection:
      selection_rat:
        process_name|contains:
          - "anydesk"
          - "teamviewer"
          - "screenconnect"
          - "atera"
          - "ngrok"
      selection_tunnel:
        command_line|contains:
          - "ssh -R"
          - "plink -R"
          - "chisel client"
          - "socat tcp-listen"
      condition: 1 of selection_*
    falsepositives:
      - IT support using an approved remote-support tool
      - Developers tunnelling to a staging environment

  - id: dp014-credential-and-token-theft
    title: Authentication Token and Certificate Theft
    level: critical
    techniques: [T1649, T1528, T1550, T1606, T1539, T1635, T1634, T1111, T1621, T1556, T1098.001]
    tactics: [credential-access, defense-evasion]
    description: >
      Detects theft or forging of authentication material -- certificates,
      session cookies, OAuth and API tokens. Stolen tokens bypass MFA entirely,
      which is why this class has displaced password theft as the primary
      cloud-intrusion vector.
    logsource: {category: process_creation}
    detection:
      selection_cert_export:
        command_line|contains:
          - "certutil -exportpfx"
          - "Export-PfxCertificate"
          - "certreq -submit"
      selection_token_theft:
        command_line|contains:
          - "Cookies.sqlite"
          - "Local State"
          - "access_token"
          - "refresh_token"
      condition: 1 of selection_*
    falsepositives:
      - Certificate lifecycle automation exporting keys for renewal
      - Browser profile migration during device refresh

  - id: dp015-cloud-control-plane-abuse
    title: Cloud Control-Plane and Identity Abuse
    level: high
    techniques: [T1651, T1666, T1671, T1648, T1580, T1526, T1538, T1069.003, T1087.004, T1098.003, T1578, T1619, T1675, T1670, T1673]
    tactics: [execution, persistence, privilege-escalation, discovery]
    description: >
      Detects use of cloud administration APIs to enumerate, escalate or
      persist. In a cloud estate the control plane is the real perimeter: a
      single over-permissioned token can create durable access without ever
      touching a host.
    logsource: {category: process_creation}
    detection:
      selection_iam_change:
        command_line|contains:
          - "iam create-user"
          - "iam attach-user-policy"
          - "iam create-access-key"
          - "az role assignment create"
      selection_enum:
        command_line|contains:
          - "iam list-roles"
          - "az ad user list"
          - "gcloud projects get-iam-policy"
      selection_remote_exec:
        command_line|contains:
          - "ssm send-command"
          - "az vm run-command"
          - "gcloud compute ssh"
      condition: 1 of selection_*
    falsepositives:
      - Infrastructure-as-code applying IAM changes
      - Cloud operations staff performing approved administration

  - id: dp016-collection-and-capture
    title: Local Data Collection and Input Capture
    level: high
    techniques: [T1005, T1056, T1113, T1115, T1123, T1125, T1119, T1185, T1414, T1417, T1429, T1409, T1074.001, T1217, T1674]
    tactics: [collection, credential-access]
    description: >
      Detects screen capture, keylogging, clipboard access and bulk local file
      collection. Collection is the step where an intrusion converts access
      into the data that actually causes the loss.
    logsource: {category: process_creation}
    detection:
      selection_capture:
        command_line|contains:
          - "Get-Clipboard"
          - "SetWindowsHookEx"
          - "screencapture"
          - "import -window root"
      selection_bulk_read:
        command_line|contains:
          - "findstr /s /i password"
          - "grep -r password"
          - "Select-String -Pattern password"
      condition: 1 of selection_*
    falsepositives:
      - Screenshot and screen-recording utilities used legitimately
      - Developers grepping their own source tree

  - id: dp017-exploitation-and-driver-abuse
    title: Exploitation Attempts and Vulnerable Driver Abuse
    level: critical
    techniques: [T1190, T1210, T1211, T1203, T1068.001, T1404, T1428, T1658, T1664, T1212, T1006, T1014, T1207, T1601]
    tactics: [initial-access, privilege-escalation, defense-evasion]
    description: >
      Detects exploitation tooling and loading of known-vulnerable drivers
      (bring-your-own-vulnerable-driver). BYOVD is the standard route to kernel
      privileges, from which endpoint protection can be disabled outright.
    logsource: {category: process_creation}
    detection:
      selection_byovd:
        command_line|contains:
          - "sc create"
        # ENH-039: second condition must use a DISTINCT key or YAML
        # silently discards the first (duplicate mapping key).
        command_line|contains|all:
          - ".sys"
      selection_exploit_tools:
        process_name|contains:
          - "metasploit"
          - "msfvenom"
          - "cobaltstrike"
          - "sliver"
      selection_driver_load:
        command_line|contains:
          - "fltmc load"
          - "drvload"
      condition: 1 of selection_*
    falsepositives:
      - Driver installation during legitimate hardware deployment
      - Authorised red-team tooling (correlate with the engagement window)

  - id: dp018-email-and-messaging-abuse
    title: Email Abuse, Spoofing and Mailbox Manipulation
    level: high
    techniques: [T1566.001, T1566.002, T1566.003, T1672, T1667, T1114, T1534, T1137, T1660, T1659, T1221]
    tactics: [initial-access, collection, persistence]
    description: >
      Detects mailbox rule manipulation, bulk mail access and mail-based
      delivery. Hidden forwarding rules are a classic business-email-compromise
      persistence mechanism that survives a password reset.
    logsource: {category: process_creation}
    detection:
      selection_mail_rules:
        command_line|contains:
          - "New-InboxRule"
          - "Set-Mailbox -ForwardingSmtpAddress"
          - "Add-MailboxPermission"
      selection_mail_export:
        command_line|contains:
          - "New-MailboxExportRequest"
          - "Search-Mailbox"
      condition: 1 of selection_*
    falsepositives:
      - Exchange administrators performing legitimate mailbox delegation
      - eDiscovery and legal-hold export workflows

  - id: dp019-network-service-and-sniffing
    title: Network Scanning, Sniffing and Service Discovery
    level: medium
    techniques: [T1046, T1040, T1135, T1018.001, T1590, T1592, T1595, T1201, T1652, T1669, T1120, T1518.001]
    tactics: [discovery, credential-access]
    description: >
      Detects port scanning, packet capture and share enumeration. Scanning
      from an internal host is far more suspicious than from a management
      subnet, so this rule is a strong candidate for tenant-level tuning by
      source.
    logsource: {category: process_creation}
    detection:
      selection_scanner:
        process_name|contains:
          - "nmap"
          - "masscan"
          - "zenmap"
      selection_sniffer:
        process_name|contains:
          - "tcpdump"
          - "windump"
          - "wireshark"
          - "tshark"
      selection_share_enum:
        command_line|contains:
          - "net view \\\\"
          - "Get-SmbShare"
          - "smbclient -L"
      condition: 1 of selection_*
    falsepositives:
      - Vulnerability scanners on an approved schedule
      - Network engineers capturing traffic for fault diagnosis

  - id: dp020-file-and-media-staging
    title: Removable Media and File Discovery Staging
    level: medium
    techniques: [T1083, T1091, T1092, T1052.001, T1080, T1105.001, T1570, T1544, T1197, T1407, T1661, T1644, T1643]
    tactics: [discovery, collection, lateral-movement]
    description: >
      Detects recursive file discovery and staging to removable media or
      network shares -- the physical and lateral routes data takes out of an
      estate when network exfiltration is blocked.
    logsource: {category: process_creation}
    detection:
      selection_recursive_find:
        command_line|contains:
          - "dir /s /b"
          - "find / -name"
          - "Get-ChildItem -Recurse"
        # ENH-039: second condition must use a DISTINCT key or YAML
        # silently discards the first (duplicate mapping key).
        command_line|contains|all:
          - ".docx"
          - ".xlsx"
          - ".pdf"
      selection_media_copy:
        command_line|contains:
          - "xcopy"
          - "robocopy"
        # ENH-039: second condition must use a DISTINCT key or YAML
        # silently discards the first (duplicate mapping key).
        command_line|contains|all:
          - "/s /e"
      selection_bits:
        command_line|contains:
          - "bitsadmin /create"
          - "Start-BitsTransfer"
      condition: 1 of selection_*
    falsepositives:
      - Backup and file-migration jobs using robocopy
      - Users legitimately copying documents to a USB drive

  - id: dp021-integrity-and-availability-attacks
    title: Data Manipulation and Availability Attacks
    level: critical
    techniques: [T1565, T1641, T1642, T1491.001, T1499, T1498, T1531, T1640, T1657, T1662, T1495, T1600, T1653, T1668]
    tactics: [impact]
    description: >
      Detects data manipulation, account lockout and denial-of-service actions.
      Integrity attacks are the hardest class to recover from because, unlike
      encryption, the damage is silent and may be discovered long afterwards.
    logsource: {category: process_creation}
    detection:
      selection_account_lockout:
        command_line|contains:
          - "net user"
        # ENH-039: second condition must use a DISTINCT key or YAML
        # silently discards the first (duplicate mapping key).
        command_line|contains|all:
          - "/active:no"
      selection_password_reset:
        command_line|contains:
          - "Set-ADAccountPassword -Reset"
          - "net user administrator"
      selection_resource_exhaustion:
        command_line|contains:
          - ":(){ :|:& };:"
          - "fork bomb"
      condition: 1 of selection_*
    falsepositives:
      - Identity teams disabling leavers' accounts
      - Scheduled password rotation for service accounts

  - id: dp022-evasion-and-artifact-removal
    title: Indicator Removal and Artifact Manipulation
    level: high
    techniques: [T1070.003, T1070.004, T1070.006, T1027.001, T1140, T1220, T1655, T1656, T1564, T1222, T1001, T1132, T1030.001, T1029.001, T1647]
    tactics: [defense-evasion]
    description: >
      Detects timestomping, history clearing and file-attribute manipulation
      used to frustrate forensics. These actions have no operational purpose,
      so they carry unusually high fidelity for defence evasion.
    logsource: {category: process_creation}
    detection:
      selection_history_clear:
        command_line|contains:
          - "history -c"
          - "Clear-History"
          - "unset HISTFILE"
      selection_timestomp:
        command_line|contains:
          - "touch -t"
          - "Set-ItemProperty -Name LastWriteTime"
      selection_hide_file:
        command_line|contains:
          - "attrib +h +s"
          - "chattr +i"
      condition: 1 of selection_*
    falsepositives:
      - Shell hygiene scripts clearing history at logout
      - Build systems normalising file timestamps for reproducible builds

  # =========================================================================
  # BATCH 3 -- remaining host-observable techniques (ENH-039)
  # =========================================================================

  - id: dp023-execution-flow-hijacking
    title: Execution Flow Hijacking and Code Injection
    level: critical
    techniques: [T1574, T1625, T1055.001, T1055.012, T1620, T1631, T1617, T1129, T1106, T1575, T1623, T1559.001, T1577, T1546.001]
    tactics: [persistence, privilege-escalation, defense-evasion]
    description: >
      Detects DLL search-order hijacking, side-loading and reflective code
      loading. These run attacker code inside a trusted, signed process, which
      defeats naive allow-listing and process-name-based detection alike.
    logsource: {category: process_creation}
    detection:
      selection_sideload:
        command_line|contains:
          - "rundll32"
        # ENH-039: second condition must use a DISTINCT key or YAML
        # silently discards the first (duplicate mapping key).
        command_line|contains|all:
          - "\\temp\\"
          - "\\appdata\\"
      selection_reflective:
        command_line|contains:
          - "Reflection.Assembly]::Load"
          - "VirtualAllocEx"
          - "WriteProcessMemory"
      selection_hook:
        command_line|contains:
          - "SetWindowsHookEx"
          - "LD_PRELOAD"
      condition: 1 of selection_*
    falsepositives:
      - Application installers that legitimately load DLLs from temp
      - Debuggers and profilers attaching to a process

  - id: dp024-defense-evasion-guardrails
    title: Sandbox Evasion, Debugger Evasion and Execution Guardrails
    level: high
    techniques: [T1633, T1622, T1627, T1497, T1480, T1628, T1629, T1630, T1632, T1553.002, T1564.001, T1654]
    tactics: [defense-evasion, discovery]
    description: >
      Detects environment checks used to avoid running inside analysis
      sandboxes, and log enumeration used to find what is being recorded.
      Malware performs these checks precisely because defenders use sandboxes.
    logsource: {category: process_creation}
    detection:
      selection_vm_check:
        command_line|contains:
          - "VBoxService"
          - "vmtoolsd"
          - "Get-WmiObject Win32_ComputerSystem"
        # ENH-039: second condition must use a DISTINCT key or YAML
        # silently discards the first (duplicate mapping key).
        command_line|contains|all:
          - "model"
          - "manufacturer"
      selection_debugger_check:
        command_line|contains:
          - "IsDebuggerPresent"
          - "CheckRemoteDebuggerPresent"
      selection_log_enum:
        command_line|contains:
          - "wevtutil el"
          - "Get-WinEvent -ListLog"
      condition: 1 of selection_*
    falsepositives:
      - Inventory tooling reading system model and manufacturer
      - Developers debugging locally

  - id: dp025-config-repository-and-policy-discovery
    title: Configuration Repository and Group Policy Discovery
    level: medium
    techniques: [T1602, T1615, T1069.001, T1069.002, T1012.001, T1599, T1604, T1609, T1213]
    tactics: [discovery, collection]
    description: >
      Detects enumeration of group policy, network device configuration and
      internal repositories. These hold credentials and topology that let an
      operator plan movement without generating further noise.
    logsource: {category: process_creation}
    detection:
      selection_gpo:
        command_line|contains:
          - "gpresult /z"
          - "Get-GPO -All"
          - "\\SYSVOL\\"
      selection_config_pull:
        command_line|contains:
          - "show running-config"
          - "copy running-config tftp"
      selection_repo:
        command_line|contains:
          - "git clone http"
        # ENH-039: second condition must use a DISTINCT key or YAML
        # silently discards the first (duplicate mapping key).
        command_line|contains|all:
          - "internal"
      condition: 1 of selection_*
    falsepositives:
      - Administrators auditing group policy application
      - Network teams backing up device configuration

  - id: dp026-adversary-in-the-middle-and-alt-exfil
    title: Adversary-in-the-Middle and Alternative-Channel Exfiltration
    level: high
    techniques: [T1638, T1557, T1639, T1646, T1637, T1568.002, T1071.004, T1048.003, T1665, T1584.005]
    tactics: [credential-access, collection, exfiltration, command-and-control]
    description: >
      Detects traffic interception (ARP/LLMNR poisoning) and exfiltration over
      DNS or other non-web channels. DNS tunnelling in particular is favoured
      because DNS is almost never blocked at the egress.
    logsource: {category: process_creation}
    detection:
      selection_mitm_tools:
        process_name|contains:
          - "responder"
          - "ettercap"
          - "bettercap"
          - "mitm6"
      selection_dns_tunnel:
        command_line|contains:
          - "nslookup -type=txt"
          - "dnscat"
          - "iodine"
      condition: 1 of selection_*
    falsepositives:
      - Security teams running authorised interception tests
      - Diagnostic DNS queries using TXT records

  - id: dp027-elevation-and-trust-abuse
    title: Elevation Control and Trust Subversion
    level: high
    techniques: [T1626, T1548.001, T1548.002, T1548.003, T1632.001, T1553.001, T1553.003, T1553.005, T1600.001, T1624, T1546.003]
    tactics: [privilege-escalation, defense-evasion]
    description: >
      Detects UAC bypass, setuid abuse and code-signing trust subversion.
      Subverting trust controls is what lets unsigned attacker code run in an
      environment configured to reject it.
    logsource: {category: process_creation}
    detection:
      selection_uac_bypass:
        command_line|contains:
          - "fodhelper.exe"
          - "computerdefaults.exe"
          - "eventvwr.exe"
        # ENH-039: second condition must use a DISTINCT key or YAML
        # silently discards the first (duplicate mapping key).
        command_line|contains|all:
          - "reg add"
      selection_setuid:
        command_line|contains:
          - "chmod u+s"
          - "chmod 4755"
      selection_trust:
        command_line|contains:
          - "Set-AuthenticodeSignature"
          - "Add-MpPreference -ExclusionPath"
      condition: 1 of selection_*
    falsepositives:
      - Installers requesting elevation through documented mechanisms
      - Administrators adding legitimate AV exclusions (should be reviewed)

  # =========================================================================
  # BATCH 4 -- final host/cloud-observable techniques (ENH-039)
  # =========================================================================

  - id: dp028-external-access-and-trust-abuse
    title: External Remote Services and Trusted Relationship Abuse
    level: high
    techniques: [T1133, T1199, T1195, T1189, T1072, T1176, T1505, T1554, T1525, T1563, T1187]
    tactics: [initial-access, persistence, lateral-movement]
    description: >
      Detects abuse of external access paths and trusted third-party channels --
      VPN/RDP exposure, web shells, malicious browser extensions and software
      deployment tooling. Supply-chain and trusted-relationship intrusions
      arrive through a channel the organisation already permits.
    logsource: {category: process_creation}
    detection:
      selection_webshell:
        command_line|contains:
          - "w3wp.exe"
          - "httpd.exe"
        # ENH-039: second condition must use a DISTINCT key or YAML
        # silently discards the first (duplicate mapping key).
        command_line|contains|all:
          - "cmd.exe"
          - "/bin/sh"
      selection_deploy_tool:
        command_line|contains:
          - "psexec \\\\"
          - "sccm"
          - "ansible-playbook"
        # ENH-039: second condition must use a DISTINCT key or YAML
        # silently discards the first (duplicate mapping key).
        command_line|contains|all:
          - "powershell"
      selection_extension:
        command_line|contains:
          - "--load-extension"
          - "chrome://extensions"
      condition: 1 of selection_*
    falsepositives:
      - Legitimate CI/CD deployment pipelines invoking remote execution
      - Web applications that intentionally shell out (should be reviewed)

  - id: dp029-token-manipulation-and-proxy-execution
    title: Access Token Manipulation and Script Proxy Execution
    level: high
    techniques: [T1134, T1216, T1484, T1569, T1603, T1398, T1541]
    tactics: [privilege-escalation, defense-evasion, execution]
    description: >
      Detects impersonation via access tokens and execution proxied through
      signed system scripts. Token manipulation lets a process act as another
      user without ever presenting that user's credentials.
    logsource: {category: process_creation}
    detection:
      selection_token:
        command_line|contains:
          - "runas /user:"
          - "ImpersonateLoggedOnUser"
          - "SeDebugPrivilege"
      selection_script_proxy:
        command_line|contains:
          - "pubprn.vbs"
          - "syncappvpublishingserver"
          - "cscript //e:"
      selection_domain_policy:
        command_line|contains:
          - "Set-ADDefaultDomainPasswordPolicy"
          - "Set-GPRegistryValue"
      condition: 1 of selection_*
    falsepositives:
      - Administrators using runas for legitimate privileged tasks
      - Group policy management by directory administrators

  - id: dp030-cloud-storage-and-data-egress
    title: Cloud Storage Access and Data Egress
    level: high
    techniques: [T1530, T1537, T1567, T1532, T1533, T1535, T1496, T1481, T1509, T1521, T1437]
    tactics: [collection, exfiltration, impact, command-and-control]
    description: >
      Detects bulk cloud-storage access, transfer to attacker-controlled
      accounts, and resource hijacking (cryptomining). Exfiltration to a
      legitimate cloud provider is difficult to block at the network layer,
      which is exactly why operators use it.
    logsource: {category: process_creation}
    detection:
      selection_bulk_cloud_read:
        command_line|contains:
          - "aws s3 sync"
          - "aws s3 cp --recursive"
          - "az storage blob download-batch"
          - "gsutil -m cp -r"
      selection_egress_service:
        command_line|contains:
          - "rclone copy"
          - "megatools put"
          - "dropbox_uploader"
      selection_mining:
        command_line|contains:
          - "xmrig"
          - "stratum+tcp"
          - "--donate-level"
      condition: 1 of selection_*
    falsepositives:
      - Backup and data-migration jobs synchronising buckets
      - Data engineering pipelines moving large datasets

  - id: dp031-boot-integrity-and-screen-capture
    title: Pre-OS Boot Tampering and Screen/Video Capture
    level: critical
    techniques: [T1542, T1513, T1512, T1406, T1420, T1421, T1422, T1458, T1464, T1471]
    tactics: [persistence, defense-evasion, collection, impact]
    description: >
      Detects bootloader and firmware tampering, and screen or video capture.
      Pre-OS persistence survives reinstallation, making it among the hardest
      footholds to remove once established.
    logsource: {category: process_creation}
    detection:
      selection_boot_tamper:
        # Both parts required: `bcdedit /set` alone is ordinary boot
        # configuration, so the dangerous FLAG is the discriminator. The flags
        # themselves are alternatives, hence a nested |all + |contains pair
        # would be wrong -- this uses a single regex instead.
        command_line|regex: "bcdedit /set.*(testsigning|nointegritychecks)"
      selection_bootloader:
        command_line|contains:
          - "bootrec /fixmbr"
          - "dd of=/dev/sda bs=512 count=1"
      selection_capture:
        command_line|contains:
          - "ffmpeg -f gdigrab"
          - "ffmpeg -f x11grab"
      condition: 1 of selection_*
    falsepositives:
      - Driver developers enabling test signing on a lab machine
      - Screen-recording software used for training or support
