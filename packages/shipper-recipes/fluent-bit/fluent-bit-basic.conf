# Fluent Bit Basic Configuration for Logforge
# Monitors log files and sends to Logforge with proper formatting

[SERVICE]
    # Fluent Bit service configuration
    Flush         5
    Daemon        off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    storage.path  /tmp/fluent-bit/

[INPUT]
    Name              tail
    Tag               logs.*
    Path              /var/log/*.log,/var/log/**/*.log
    Parser            logfmt
    Refresh_Interval  5
    Rotate_Wait       30
    storage.type      filesystem
    Read_from_Head    false

[FILTER]
    Name          record_modifier
    Match         logs.*
    Record        host ${HOSTNAME}
    Record        source fluent-bit

[FILTER]
    Name          lua
    Match         logs.*
    Script        logforge_transform.lua
    Call          transform_for_logforge

[OUTPUT]
    Name          http
    Match         logs.*
    Host          localhost
    Port          7080
    URI           /v1/ingest/logs/batch
    Format        json
    json_date_key timestamp
    json_date_format iso8601
    
    # Headers
    Header        Content-Type application/json
    # Logforge API key (lf_...); it also selects the tenant.
    Header        Authorization Bearer ${LOGFORGE_API_KEY}
    Header        User-Agent Fluent-Bit-Logforge/1.0
    
    # Buffer and retry configuration
    storage.total_limit_size  100M
    Retry_Limit              3
    Workers                  4
    
    # No request compression: the Logforge API does not decode gzip bodies.