# Fluentd basic configuration for Logforge
#
# Tails log files and sends them to POST /v1/ingest/logs/batch with the
# built-in out_http plugin (Fluentd >= 1.7; no extra gems).
#
# Environment:
#   LOGFORGE_API_KEY   Logforge API key (lf_...). It also selects the tenant,
#                      so no X-Customer-ID header is needed.
#   LOGFORGE_URL       API base URL (default http://localhost:7080)
#   LOGFORGE_SERVICE   service name stamped on every record (default fluentd)

<source>
  @type tail
  path /var/log/app/*.log
  pos_file /fluentd/log/logforge-app.pos
  tag logforge.app
  read_from_head true
  # Pick up newly created files within 10s (default is 60s).
  refresh_interval 10
  <parse>
    # One log line per record; use @type json / regexp for structured logs.
    @type none
  </parse>
</source>

# Map each record to Logforge's log shape: msg and service are required.
<filter logforge.**>
  @type record_transformer
  enable_ruby true
  <record>
    msg ${record["message"]}
    service "#{ENV['LOGFORGE_SERVICE'] || 'fluentd'}"
    host "#{Socket.gethostname}"
    level ${record["level"] || "info"}
  </record>
  remove_keys message
</filter>

<match logforge.**>
  @type http
  endpoint "#{ENV['LOGFORGE_URL'] || 'http://localhost:7080'}/v1/ingest/logs/batch"
  http_method post
  content_type application/json
  # Double-quoted so Fluentd expands #{ENV[...]} when it loads the config.
  headers "{\"Authorization\":\"Bearer #{ENV['LOGFORGE_API_KEY']}\"}"
  # Send each buffer chunk as one JSON array: the batch endpoint accepts a
  # bare array of up to 1000 entries.
  json_array true
  # The API decodes gzip request bodies.
  compress gzip
  open_timeout 5
  read_timeout 30
  # Retry when the API sheds load (503) or is briefly unavailable.
  retryable_response_codes [429, 502, 503, 504]

  <format>
    @type json
  </format>

  <buffer>
    @type file
    path /fluentd/log/buffer/logforge
    chunk_limit_records 1000
    flush_interval 5s
    retry_type exponential_backoff
    retry_max_times 10
  </buffer>
</match>
