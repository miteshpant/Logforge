title: Google Workspace suspicious sign-in
id: identity-gws-suspicious-login
status: stable
description: Google flagged a sign-in as suspicious or as a likely government-backed attack.
author: Logforge
tags: [attack.initial_access, attack.t1078.004]
logsource: {product: google_workspace, service: login}
detection:
  selection:
    service: gworkspace
    event_type: [login.suspicious_login, login.suspicious_login_less_secure_app, login.suspicious_programmatic_login, login.gov_attack_warning]
  condition: selection
fixtures:
  true_positive: {service: gworkspace, event_type: login.suspicious_login, target_user: erin@acme.example}
  true_negative: {service: gworkspace, event_type: login.login_success, target_user: erin@acme.example}
level: high
