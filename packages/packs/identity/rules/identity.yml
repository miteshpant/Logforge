title: Google Workspace admin role granted
id: identity-gws-admin-granted
status: stable
description: A Workspace administrator role was assigned to a user, or a user was made a super admin.
author: Logforge
tags: [attack.privilege_escalation, attack.t1098.003]
logsource: {product: google_workspace, service: admin}
detection:
  selection:
    service: gworkspace
    event_type: [admin.ASSIGN_ROLE, admin.GRANT_ADMIN_PRIVILEGE, admin.GRANT_DELEGATED_ADMIN_PRIVILEGES]
  condition: selection
fixtures:
  true_positive: {service: gworkspace, event_type: admin.ASSIGN_ROLE, target_user: carol@acme.example}
  true_negative: {service: gworkspace, event_type: admin.UNASSIGN_ROLE, target_user: carol@acme.example}
level: high
