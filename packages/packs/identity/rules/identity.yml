title: Okta threat detected
id: identity-okta-threat-detected
status: stable
description: Okta ThreatInsight flagged requests from an IP (password spraying, credential stuffing).
author: Logforge
tags: [attack.credential_access, attack.t1110.003]
logsource: {product: okta, service: okta}
detection:
  selection: {service: okta, event_type: security.threat.detected}
  condition: selection
fixtures:
  true_positive: {service: okta, event_type: security.threat.detected, outcome: DENY}
  true_negative: {service: okta, event_type: security.request.blocked, outcome: DENY}
level: medium
