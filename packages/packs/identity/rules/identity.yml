title: Okta MFA factors reset or removed
id: identity-okta-mfa-reset
status: stable
description: Someone reset or deactivated another user's MFA factors, which lets a new device be enrolled for that account.
author: Logforge
tags: [attack.persistence, attack.t1556.006]
logsource: {product: okta, service: okta}
detection:
  selection:
    service: okta
    event_type: [user.mfa.factor.reset_all, user.mfa.factor.deactivate, user.mfa.factor.suspend]
    outcome: SUCCESS
  condition: selection
fixtures:
  true_positive: {service: okta, event_type: user.mfa.factor.reset_all, outcome: SUCCESS, target_user: bob@acme.example}
  true_negative: {service: okta, event_type: user.mfa.factor.activate, outcome: SUCCESS, target_user: bob@acme.example}
level: medium
---
title: Okta admin privilege granted
id: identity-okta-admin-granted
status: stable
description: A user or group was given an Okta administrator role.
author: Logforge
tags: [attack.privilege_escalation, attack.t1098.003]
logsource: {product: okta, service: okta}
detection:
  selection:
    service: okta
    event_type: [user.account.privilege.grant, group.privilege.grant]
  condition: selection
fixtures:
  true_positive: {service: okta, event_type: user.account.privilege.grant, admin_role: SUPER_ADMIN}
  true_negative: {service: okta, event_type: user.account.privilege.revoke, admin_role: SUPER_ADMIN}
level: high
