title: Kubernetes exec or attach into a pod
id: kubernetes-exec-into-pod
status: stable
description: Someone opened a shell (exec) or attached to a running container, which bypasses the deployment process.
author: Logforge
tags: [attack.execution, attack.t1609]
logsource: {product: kubernetes, service: audit}
detection:
  selection:
    service: k8s-audit
    verb: create
    resource: pods
    subresource: [exec, attach]
  filter: {response_code|gte: 400}
  condition: selection and not filter
fixtures:
  true_positive: {service: k8s-audit, verb: create, resource: pods, subresource: exec, response_code: 101}
  true_negative: {service: k8s-audit, verb: get, resource: pods, subresource: log, response_code: 200}
level: medium
---
title: Kubernetes secret read by a person
id: kubernetes-secret-read-by-user
status: stable
description: A secret was read or listed by a user account rather than a service account or a system component.
author: Logforge
tags: [attack.credential_access, attack.t1552.007]
logsource: {product: kubernetes, service: audit}
detection:
  selection:
    service: k8s-audit
    resource: secrets
    verb: [get, list, watch]
    human: "yes"
  filter: {response_code|gte: 400}
  condition: selection and not filter
fixtures:
  true_positive: {service: k8s-audit, resource: secrets, verb: get, human: "yes", response_code: 200}
  true_negative: {service: k8s-audit, resource: secrets, verb: get, human: "no", response_code: 200}
level: medium
