title: Windows event log cleared
id: windows-log-cleared
status: stable
description: The Security log (1102) or the System log (104) was cleared, a common step to hide activity.
author: Logforge
tags: [attack.defense_evasion, attack.t1070.001]
logsource: {product: windows, service: security}
detection:
  selection: {service: windows, event_id: [1102, 104]}
  condition: selection
fixtures:
  true_positive: {service: windows, event_id: 1102, channel: Security, subject_user: helpdesk1}
  true_negative: {service: windows, event_id: 4624, channel: Security, subject_user: helpdesk1}
level: high
---
title: User added to a privileged local or domain group
id: windows-admin-group-add
status: stable
description: A member was added to Administrators, Domain Admins, Enterprise Admins or Schema Admins.
author: Logforge
tags: [attack.persistence, attack.t1098]
logsource: {product: windows, service: security}
detection:
  selection:
    service: windows
    event_id: [4728, 4732, 4756]
    group_name: [Administrators, Domain Admins, Enterprise Admins, Schema Admins]
  condition: selection
fixtures:
  true_positive: {service: windows, event_id: 4732, group_name: Administrators, member_name: "CN=Mallory"}
  true_negative: {service: windows, event_id: 4732, group_name: Remote Desktop Users, member_name: "CN=Mallory"}
level: high
