{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logforge.secretName" . }}
  labels: {{- include "logforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "secrets.jwtSecret is required (or secrets.existingSecret)" .Values.secrets.jwtSecret | quote }}
  clickhouse-password: {{ .Values.secrets.clickhousePassword | quote }}
  s3-access-key: {{ .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | quote }}
{{- end }}
