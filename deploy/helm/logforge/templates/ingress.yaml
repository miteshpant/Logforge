{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "logforge.fullname" . }}
  labels: {{- include "logforge.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend: {service: {name: {{ include "logforge.fullname" . }}-api, port: {name: http}}}
          - path: /health
            pathType: Exact
            backend: {service: {name: {{ include "logforge.fullname" . }}-api, port: {name: http}}}
          {{- if .Values.ui.enabled }}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ include "logforge.fullname" . }}-ui, port: {name: http}}}
          {{- end }}
{{- end }}
