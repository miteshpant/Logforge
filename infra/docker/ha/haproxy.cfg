# HA compose load balancer: the API replicas on :7080, the ClickHouse
# replicas' HTTP interface on :8123. Health checks take a dead replica out
# within seconds; requests in flight to it fail and clients retry.
global
  maxconn 4096

# Docker's DNS, so replicas are resolved at runtime (they may start after,
# or restart with new addresses).
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 2s

defaults
  mode http
  timeout connect 3s
  timeout client 300s
  timeout server 300s
  retries 2
  option redispatch

frontend api
  bind :7080
  default_backend api

backend api
  balance roundrobin
  option httpchk GET /health
  default-server inter 1s fall 2 rise 2 resolvers docker init-addr none
  server api1 api1:8080 check
  server api2 api2:8080 check

frontend clickhouse
  bind :8123
  default_backend clickhouse

# ClickHouse: every query to ch1 while it is up, ch2 only when it is not.
# Replication is asynchronous, so round-robin reads could miss a write made
# a moment before on the other replica (a setup token, a saved rule).
backend clickhouse
  option httpchk GET /ping
  default-server inter 1s fall 2 rise 2 resolvers docker init-addr none
  server ch1 ch1:8123 check
  server ch2 ch2:8123 check backup
