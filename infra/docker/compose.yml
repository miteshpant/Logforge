version: '3.8'

services:
  # ClickHouse - Hot data storage
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: logforge-clickhouse
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init_simple.sql:/docker-entrypoint-initdb.d/01-init.sql
    environment:
      CLICKHOUSE_DB: logforge
      CLICKHOUSE_USER: logforge
      CLICKHOUSE_PASSWORD: logforge123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - logforge-network

  # MinIO - S3-compatible cold storage
  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: logforge-minio
    ports:
      - "9003:9000"
      - "9004:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - logforge-network

  # Redpanda - Kafka-compatible message broker
  # Redis - Alert rule caching and event processing
  redis:
    image: redis:7-alpine
    container_name: logforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - logforge-network

  redpanda:
    image: redpandadata/redpanda:v23.2.8
    container_name: logforge-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --smp=1
      - --memory=1G
      - --mode=dev-container
      - --default-log-level=info
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - logforge-network


  # ClickHouse Migration Service
  clickhouse-migrations:
    image: curlimages/curl:latest
    container_name: logforge-clickhouse-migrations
    volumes:
      - ./clickhouse/run_migrations.sh:/run_migrations.sh
      - ./clickhouse/entrypoint-migrations.sh:/entrypoint-migrations.sh
      - ./clickhouse/migrations:/migrations
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=logforge
      - CLICKHOUSE_PASSWORD=logforge123
      - CLICKHOUSE_DATABASE=logforge
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["/bin/sh", "/entrypoint-migrations.sh"]
    networks:
      - logforge-network
    restart: "no"  # Only run once, not restart on failure

  # FastAPI Backend
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: logforge-api
    ports:
      - "7080:8080"
    volumes:
      - ../../apps/api:/app
      # Read-only so the app can report migration state/drift; DDL is applied
      # by the clickhouse-migrations service, not the API.
      - ../../infra/docker/clickhouse/migrations:/migrations:ro
    environment:
      - PYTHONPATH=/app
      - MIGRATIONS_DIR=/migrations
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=logforge
      - CLICKHOUSE_PASSWORD=logforge123
      - CLICKHOUSE_DATABASE=logforge
      - REDPANDA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-migrations:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - logforge-network

  # Next.js Frontend
  ui:
    build:
      context: ../../apps/ui
      dockerfile: Dockerfile
    container_name: logforge-ui
    ports:
      - "3001:3000"
    volumes:
      - ../../apps/ui:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:7080
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - logforge-network

volumes:
  clickhouse-data:
  minio-data:
  redpanda-data:
  redis-data:

networks:
  logforge-network:
    driver: bridge
